<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעקב הוצאות אישי</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הוצאות">

<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--chip:#e5e7eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--line:#374151;--chip:#374151;--green:#4ade80;--red:#f87171}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--line:#374151;--chip:#374151;--green:#4ade80;--red:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:16px 16px 110px;background:var(--bg);color:var(--text);font-family:"Heebo",Arial,sans-serif;max-width:560px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 14px}
h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
input,select,button,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);font-size:16px;box-sizing:border-box;background:var(--card);color:var(--text);font-family:inherit}
button{background:var(--blue);color:#fff;border:none;font-weight:bold}
.tabs{display:flex;gap:8px}
.tabs button{background:var(--chip);color:var(--text);margin:0 0 6px}
.tabs button.active{background:var(--blue);color:#fff}
.tabs button.active.inc{background:#16a34a}
.balance{font-size:28px;font-weight:bold;text-align:center}
.pos{color:var(--green)}.neg{color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.sum{display:flex;justify-content:space-between;margin-top:10px}
.del{width:auto;padding:4px 10px;margin:0 10px;background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:normal;font-size:14px}
.muted{color:var(--muted)}
button:disabled{opacity:.35}
#bottomNav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px;z-index:40;max-width:536px;margin-inline:auto}
#bottomNav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;margin:0;padding:6px 4px;background:transparent;color:var(--muted);border-radius:16px;font-size:11px;font-weight:normal}
#bottomNav button.active{background:var(--chip);color:var(--blue);font-weight:bold}
.gear{width:auto;margin:0;padding:8px 10px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;line-height:0}
.thumb{height:44px;border-radius:6px;vertical-align:middle}
.pk-btn{display:flex;justify-content:space-between;align-items:center;background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:normal;text-align:start}
.pk-list{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:-2px 0 8px;max-height:280px;overflow:auto}
.pk-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pk-item:last-child{border-bottom:none}
.pk-x{width:auto;margin:0;padding:2px 9px;background:transparent;color:var(--muted);border:none;font-size:15px;font-weight:normal}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">
  <h1 data-i18n="title" style="margin:4px 0"></h1>
  <div style="display:flex;gap:8px;align-items:center">
  <button class="gear" onclick="toggleSettings()" aria-label="Settings" id="gearBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <select id="langSel" onchange="setLang(this.value)" aria-label="Language" style="width:auto;margin:0;padding:8px">
    <option value="he">עברית</option>
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="ar">العربية</option>
  </select>
  </div>
</div>
<div id="netStatus" class="muted" style="margin:0 0 12px;font-size:14px"></div>
<div id="toast" class="card" style="display:none;border-color:var(--blue)"></div>
<div id="backupNag" class="card" style="display:none">
  <b data-i18n="nag_title"></b>
  <button onclick="downloadBackup()" data-i18n="nag_btn"></button>
</div>

<div id="pageMain">
<div class="card">
  <div class="sum" style="margin:0 0 10px;align-items:center">
    <button class="del" style="margin:0" onclick="moveMonth(-1)" data-i18n="prev_month"></button>
    <b id="monthLabel"></b>
    <button class="del" style="margin:0" id="nextMonthBtn" onclick="moveMonth(1)" data-i18n="next_month"></button>
  </div>
  <div class="sum" style="margin:0 0 10px"><span data-i18n="carry_lbl"></span><b id="carry">0</b></div>
  <div class="sum" style="margin-top:0">
    <span><span data-i18n="incomes_lbl"></span> <b id="totalIncome" class="pos">0.00</b></span>
    <span><span data-i18n="expenses_lbl"></span> <b id="totalExpense" class="neg">0.00</b></span>
  </div>
  <div class="balance" id="balance" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"></div>
</div>

<div class="card" id="scanCard">
  <input type="file" id="receiptCamera" accept="image/*" capture="environment" style="display:none" onchange="scanReceipt(this)">
  <input type="file" id="receiptInput" accept="image/*" style="display:none" onchange="scanReceipt(this)">
  <div style="display:flex;gap:8px">
    <button onclick="document.getElementById('receiptCamera').click()" data-i18n="scan_camera"></button>
    <button onclick="document.getElementById('receiptInput').click()" style="background:var(--chip);color:var(--text)" data-i18n="scan_gallery"></button>
  </div>
  <button id="warmBtn" class="del" style="display:block;width:100%;margin:6px 0" onclick="warmOcr()" data-i18n="warm_btn"></button>
  <div id="scanStatus" class="muted"></div>
  <div id="dupBox" style="display:none;border:2px solid var(--red);border-radius:10px;padding:10px;margin-top:8px">
    <b class="neg" data-i18n="dup_title"></b>
    <div id="dupInfo" style="margin:6px 0"></div>
    <div style="display:flex;gap:8px">
      <button onclick="dupCancel()" style="background:var(--chip);color:var(--text)" data-i18n="dup_cancel"></button>
      <button onclick="dupAllow()" style="background:var(--red)" data-i18n="dup_allow"></button>
    </div>
  </div>
</div>

<div class="card">
  <div class="tabs">
    <button id="tabExpense" class="active" onclick="switchTab('expense')" data-i18n="tab_expense"></button>
    <button id="tabIncome" class="inc" onclick="switchTab('income')" data-i18n="tab_income"></button>
  </div>
  <input type="number" id="amount" inputmode="decimal" data-i18n-ph="amount_ph">
  <select id="category" onchange="onCatChange()"></select>
  <input type="text" id="newCat" data-i18n-ph="newcat_ph" style="display:none">
  <select id="merchantSel" onchange="onMerchantPick()"></select>
  <input type="text" id="note" data-i18n-ph="note_ph">
  <button id="delMerchantBtn" class="del" style="display:none;width:100%;margin:4px 0" onclick="deleteMerchant()" data-i18n="del_merchant"></button>
  <div id="pendingBox"></div>
  <button id="addBtn" onclick="addEntry()"></button>
</div>

<div class="card">
  <h3 id="catTitle"></h3>
  <div id="categorySummary"></div>
</div>

<div class="card">
  <h3 data-i18n="month_entries"></h3>
  <div id="expenseList"></div>
</div>

<div class="card" id="mortCard"><div id="mortBox"></div></div>

<div class="card">
  <h3 data-i18n="rec_title"></h3>
  <div class="muted" style="font-size:14px;margin-bottom:6px" data-i18n="rec_desc"></div>
  <div id="recList"></div>
  <button id="recToggle" onclick="toggleRecForm()" data-i18n="rec_add_btn"></button>
  <div id="recForm" style="display:none">
    <input type="text" id="recName" data-i18n-ph="rec_name_ph" oninput="updateRecPreview()">
    <select id="recCat" onchange="onRecCatChange()"></select>
    <input type="text" id="recNewCat" data-i18n-ph="newcat_ph" style="display:none">
    <input type="number" id="recAmount" inputmode="decimal" data-i18n-ph="rec_amount_ph" oninput="updateRecPreview()">
    <input type="number" id="recN" inputmode="numeric" data-i18n-ph="rec_n_ph" oninput="updateRecPreview()">
    <input type="number" id="recPaid" inputmode="numeric" data-i18n-ph="rec_paid_ph" oninput="updateRecPreview()">
    <div class="muted" style="font-size:14px;margin-top:6px" data-i18n="rec_start_lbl"></div>
    <input type="month" id="recStart" onchange="updateRecPreview()">
    <input type="number" id="recDay" inputmode="numeric" min="1" max="31" data-i18n-ph="rec_day_ph" oninput="updateRecPreview()">
    <input type="number" id="recCash" inputmode="decimal" data-i18n-ph="rec_cash_ph" oninput="updateRecPreview()">
    <input type="number" id="recIncome" inputmode="decimal" data-i18n-ph="rec_income_ph" oninput="saveIncomeField();updateRecPreview()">
    <div id="recPreview" style="margin:8px 0;padding:10px;border-radius:10px;background:var(--bg);line-height:1.6"></div>
    <button onclick="saveRecurringForm()" data-i18n="rec_save"></button>
    <button onclick="toggleRecForm()" style="background:var(--chip);color:var(--text)" data-i18n="viewer_close"></button>
  </div>
</div>


</div>

<div id="pagePay" style="display:none">
<div class="card">
  <h3 data-i18n="pay_title"></h3>
  <div class="muted" style="font-size:14px;margin-bottom:8px" data-i18n="pay_desc"></div>
  <input type="file" id="payCamera" accept="image/*" capture="environment" style="display:none" onchange="scanPayslip(this)">
  <input type="file" id="payInput" accept="image/*" style="display:none" onchange="scanPayslip(this)">
  <div style="display:flex;gap:8px">
    <button onclick="document.getElementById('payCamera').click()" data-i18n="pay_camera"></button>
    <button onclick="document.getElementById('payInput').click()" style="background:var(--chip);color:var(--text)" data-i18n="pay_gallery"></button>
  </div>
  <div id="payStatus" class="muted" style="margin:6px 0"></div>
  <img id="payPreview" alt="" style="display:none;max-height:140px;border-radius:8px;margin-bottom:8px">
  <input type="number" id="payNet" inputmode="decimal" data-i18n-ph="pay_net_ph">
  <input type="number" id="payGross" inputmode="decimal" data-i18n-ph="pay_gross_ph">
  <input type="text" id="payEmployer" data-i18n-ph="pay_employer_ph">
  <div class="muted" style="font-size:14px" data-i18n="pay_slip_month"></div>
  <input type="month" id="payM">
  <div class="muted" style="font-size:14px" data-i18n="pay_month_lbl"></div>
  <input type="month" id="payAddMonth">
  <label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="paySaveImg" checked style="width:auto;margin:0"><span data-i18n="pay_save_img"></span></label>
  <details style="margin:6px 0"><summary class="muted" data-i18n="pay_raw"></summary><textarea id="payRaw" rows="5" readonly></textarea></details>
  <button onclick="payAdd()" data-i18n="pay_add"></button>
</div>
<div class="card">
  <h3 data-i18n="pay_hist"></h3>
  <div id="payHist"></div>
</div>
</div>

<div id="pageCal" style="display:none">
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <button class="del" id="calPrev" onclick="calMove(-1)" style="margin:0;font-size:18px">›</button>
    <b id="calTitle" style="font-size:17px"></b>
    <button class="del" id="calNext" onclick="calMove(1)" style="margin:0;font-size:18px">‹</button>
  </div>
  <div id="calGrid"></div>
  <div class="sum"><span class="muted" data-i18n="cal_total"></span><b class="neg" id="calMonthTotal"></b></div>
</div>
<div class="card" id="calDetail"></div>
</div>

<div id="pageShare" style="display:none">
<div class="card">
  <h3 data-i18n="share_title"></h3>
  <div class="muted" style="font-size:14px;margin-bottom:6px" data-i18n="share_desc"></div>
  <div class="muted" style="font-size:14px" data-i18n="share_months_lbl"></div>
  <select id="shareMonths" onchange="saveShareMonths();renderSharePreview()"></select>
  <pre id="sharePreview" style="white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.6;background:#dcf8c6;color:#1f2937;border-radius:12px;padding:12px;margin:8px 0"></pre>
  <button onclick="shareWhatsApp()" style="background:#16a34a" data-i18n="share_btn"></button>
</div>
</div>

<div id="pageSettings" style="display:none">
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <b style="font-size:18px">⚙️ <span data-i18n="set_title"></span></b>
    <button class="del" style="margin:0" onclick="closeSettings()" data-i18n="viewer_close"></button>
  </div>
  <button onclick="openSettings('backup')" style="display:flex;justify-content:space-between;align-items:center;background:var(--chip);color:var(--text);font-weight:normal;font-size:16px">
    <span>💾 <span data-i18n="backup_title"></span></span><span aria-hidden="true">‹</span>
  </button>
  <button onclick="openSettings('notif')" style="display:flex;justify-content:space-between;align-items:center;background:var(--chip);color:var(--text);font-weight:normal;font-size:16px">
    <span>🔔 <span data-i18n="auto_title"></span></span><span aria-hidden="true">‹</span>
  </button>
</div>
</div>

<div id="pageBackup" style="display:none">
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <button class="del" style="margin:0" onclick="openSettings('menu')">› <span data-i18n="set_back"></span></button>
  </div>
  <h3 data-i18n="backup_title"></h3>
  <button onclick="downloadBackup()" data-i18n="backup_dl"></button>
  <button onclick="showBackupText()" style="background:var(--chip);color:var(--text)" data-i18n="backup_text_btn"></button>
  <textarea id="backupText" rows="4" data-i18n-ph="backup_ph"></textarea>
  <button onclick="restoreFromBox()" data-i18n="restore_text"></button>
  <input type="file" id="restoreFile" accept=".json,application/json" onchange="restoreFromFile()">
  <div id="backupStatus" class="muted"></div>
</div>
</div>

<div id="pageNotif" style="display:none">
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <button class="del" style="margin:0" onclick="openSettings('menu')">› <span data-i18n="set_back"></span></button>
  </div>
  <h3 data-i18n="auto_title"></h3>
  <div class="muted" style="font-size:14px;margin-bottom:6px" data-i18n="auto_desc"></div>
  <div id="androidBox" style="display:none;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px">
    <b data-i18n="and_title"></b>
    <div id="androidStatus" style="margin:6px 0"></div>
    <button onclick="AndroidBridge.openNotificationAccess()" data-i18n="and_btn"></button>
    <button onclick="AndroidBridge.openBatterySettings()" style="background:var(--chip);color:var(--text)" data-i18n="and_battery"></button>
    <div class="muted" style="font-size:13px;margin-top:6px" data-i18n="and_hint"></div>
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
      <b data-i18n="src_title"></b>
      <div class="muted" style="font-size:13px;margin:4px 0 8px" data-i18n="src_desc"></div>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" id="srcInput" data-i18n-ph="src_ph" style="margin:0">
        <button onclick="addSourceFromInput()" style="width:auto;margin:0;white-space:nowrap" data-i18n="src_add"></button>
      </div>
      <div id="srcList" style="margin-top:6px"></div>
    </div>
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
      <b data-i18n="log_title"></b>
      <div class="muted" style="font-size:13px;margin:4px 0 6px" data-i18n="log_desc"></div>
      <div id="logList"></div>
      <button class="del" style="margin:6px 0 0" onclick="clearNotifLog()" data-i18n="log_clear"></button>
    </div>
  </div>
  <textarea id="notifTest" rows="3" data-i18n-ph="notif_ph"></textarea>
  <button onclick="testNotif()" data-i18n="notif_btn"></button>
  <details style="margin-top:8px"><summary class="muted" data-i18n="macro_sum"></summary>
    <div class="muted" style="font-size:14px;margin-top:6px" data-i18n="macro_desc"></div>
    <input type="text" id="autoLink" readonly onclick="this.select()" dir="ltr">
  </details>
</div>
</div>

<nav id="bottomNav">
  <button id="pgPay" onclick="showPage(0)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span data-i18n="pg_pay"></span></button>
  <button id="pgMain" class="active" onclick="showPage(1)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span data-i18n="pg_main"></span></button>
  <button id="pgCal" onclick="showPage(2)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-i18n="pg_cal"></span></button>
  <button id="pgShare" onclick="showPage(3)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span data-i18n="share_title"></span></button>
</nav>

<div id="viewer" onclick="closeReceipt()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px">
  <img id="viewerImg" alt="" style="max-width:100%;max-height:80%;border-radius:8px">
  <button style="width:auto;padding:10px 28px" data-i18n="viewer_close"></button>
</div>

  var inc = 0, exp = 0;
  ms.forEach(function (e) { if (e.type === 'income') inc += e.amount; else exp += e.amount; });
  var bal = carry + inc - exp;

  var running = [], acc = carry;
  for (var i = ms.length - 1; i >= 0; i--) { acc += net(ms[i]); running[i] = acc; }

  var shown = showAllEntries ? ms : ms.slice(0, 3);

    : '') : '<span class="muted">' + esc(t('no_entries')) + '</span>';

  ms.filter(function (e) { return e.type === currentType; }).forEach(function (e) {

function aHash(img) {
  var c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  var ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, 16, 16);
  var d = ctx.getImageData(0, 0, 16, 16).data, g = [], sum = 0, i;
  for (i = 0; i < d.length; i += 4) { var v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; g.push(v); sum += v; }
  var avg = sum / g.length, hex = '';
  for (i = 0; i < g.length; i += 4) {
    var n = 0;
    for (var j = 0; j < 4; j++) n = n * 2 + (g[i + j] > avg ? 1 : 0);
    hex += n.toString(16);
  }
  return hex;
}

function hamming(a, b) {
  if (!a || !b || a.length !== b.length) return 999;
  var diff = 0;
  for (var i = 0; i < a.length; i++) {
    var x = parseInt(a.charAt(i), 16) ^ parseInt(b.charAt(i), 16);
    while (x) { diff += x & 1; x >>= 1; }
  }
  return diff;
}

function pickDate(text) {
  var re = /(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})(?!\d)/g, m;
  while ((m = re.exec(text)) !== null) {
    var dd = +m[1], mm = +m[2], yy = +m[3];
    if (yy < 100) yy += 2000;
    if (dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12 && yy >= 2000 && yy <= 2100) {
      return yy + '-' + ('0' + mm).slice(-2) + '-' + ('0' + dd).slice(-2);
    }
  }
  return '';
}

function pickTime(text) {
  var m = String(text).match(/(?:^|[^\d:])([01]?\d|2[0-3]):([0-5]\d)(?![\d:])/);
  return m ? ('0' + m[1]).slice(-2) + ':' + m[2] : '';
}

function dayOf(e) {
  var d = new Date(e.id || Date.now());
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function findDuplicate(fp, amount, note) {
  var name = String(note || '').trim().toLowerCase();
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    if (e.type !== 'expense') continue;
    var f = e.fp;
    if (f && fp.h && f.h && hamming(f.h, fp.h) <= 8) return e;
    var sameAmount = Math.abs(e.amount - amount) < 0.005;
    if (!sameAmount) continue;
    if (f && fp.d && f.d === fp.d) {
      if (f.t && fp.t) { if (f.t === fp.t) return e; }
      else if (name && String(e.note || '').trim().toLowerCase() === name) return e;
    }
    if (!f && fp.d && dayOf(e) === fp.d && name && String(e.note || '').trim().toLowerCase() === name) return e;
  }
  return null;
}

function readImage(file) {
  return new Promise(function (resolve, reject) {
    var rd = new FileReader();
    rd.onerror = reject;
    rd.onload = function () {
      var img = new Image();
      img.onerror = reject;
      img.onload = function () { resolve(img); };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function drawScaled(img, maxSide) {
  var r = Math.min(1, maxSide / Math.max(img.width, img.height));
  var c = document.createElement('canvas');
  c.width = Math.round(img.width * r);
  c.height = Math.round(img.height * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}

function sharpen(c) {
  var ctx = c.getContext('2d');
  var d = ctx.getImageData(0, 0, c.width, c.height);
  var px = d.data;
  for (var i = 0; i < px.length; i += 4) {
    var g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    g = (g - 128) * 1.5 + 128;
    g = g < 0 ? 0 : g > 255 ? 255 : g;
    px[i] = px[i + 1] = px[i + 2] = g;
  }
  ctx.putImageData(d, 0, 0);
  return c;
}

function runOcr(canvas, onProgress) {
  if (typeof Tesseract === 'undefined') return Promise.reject({ code: 'no_lib' });
  var worker = null;
  return Tesseract.createWorker(ocrLangs(), 1, {
    logger: function (m) { if (m.status === 'recognizing text' && onProgress) onProgress(m.progress); }
  }).then(function (w) {
    worker = w;
    return worker.recognize(canvas);
  }).then(function (res) {
    markOcrReady();
    updateWarm();
    return worker.terminate().then(function () { return res.data.text; });
  }).catch(function (e) {
    if (worker) { try { worker.terminate(); } catch (err) {} }
    throw e;
  });
}

function pickAmount(text) {
  var re = /(\d{1,3}(?:[,\s]\d{3})+|\d+)[.,](\d{2})(?!\d)/g;
  var kw = /סה["״'׳]?כ|סהכ|לתשלום|סכום|total|amount|sum|balance|итого|сумма|всего|к оплате|المجموع|الإجمالي|المبلغ/i;
  var all = [], key = [];
  text.split('\n').forEach(function (line) {
    var m;
    re.lastIndex = 0;
    while ((m = re.exec(line)) !== null) {
      var after = line.charAt(m.index + m[0].length), before = line.charAt(m.index - 1);
      if (/[.\/:\-]/.test(after) || /[\/:]/.test(before)) continue;
      var v = parseFloat(m[1].replace(/[,\s]/g, '') + '.' + m[2]);
      if (v > 0) { all.push(v); if (kw.test(line)) key.push(v); }
    }
  });
  var pool = key.length ? key : all;
  return pool.length ? Math.max.apply(null, pool) : null;
}

function guessCategory(text) {
  var t = text.toLowerCase();
  var rules = [
    ['אוכל', /מסעדה|קפה|פיצה|בורגר|מאפה|מכולת|סופר|שופרסל|רמי לוי|יוחננוף|מגה|ויקטורי|אושר עד|restaurant|cafe|coffee|pizza|burger|market|супермаркет|кафе|ресторан|مطعم|مقهى|سوبرماركت|shufersal|rami levy|osher ?ad|yochananof|mega|victory|mika|aroma|cofix|wolt|10bis/],
    ['תחבורה', /דלק|פז|סונול|דור אלון|חניה|רב.?קו|מונית|גט|gett|uber|fuel|parking|taxi/],
    ['בילוי', /קולנוע|סינמה|פאב|בר |הופעה|cinema|movie|theater|pub/],
    ['חשבונות', /חשמל|ארנונה|בזק|סלקום|פרטנר|הוט|מים|electric|water|telecom/],
    ['קניות', /חנות|קניון|אופנה|store|shop|mall|магазин|متجر|محل/]
  ];
  for (var i = 0; i < rules.length; i++) {
    if (rules[i][1].test(t) && cats.expense.indexOf(rules[i][0]) !== -1) return rules[i][0];
  }
  return null;
}

function guessNote(text) {
  var lines = String(text || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
  var bad = /חשבונית|קבלה|טלפון|טל[.:]|פקס|תאריך|שעה|קופה|קופאי|הזמנה|סה["״'׳]?כ|לתשלום|אשראי|מזומן|כתובת|רחוב|רח[.׳']|שד[.׳']|ישראל|מיקוד|מספר|תודה|לשבת|מוצר|כמות|סכום|פריט|ברקוד|www|\.com|@|invoice|receipt|tax|total|date|cashier|order|qty|amount|street|israel/i;
  var idOf = /ח\.?\s*פ|עוסק|vat|reg\.?\s*no/i;
  function clean(l) {
    var c = l.replace(/[^A-Za-z\u0590-\u05FF\u0400-\u04FF\u0600-\u06FF'"״׳ \-]/g, ' ').replace(/\s+/g, ' ').trim();
    return c.replace(/\s*(בע["״]מ|בע׳מ|בעמ|בע|ltd\.?|inc\.?)\s*$/i, '').trim();
  }
  function ok(l) {
    if (bad.test(l) || /[,،]/.test(l)) return '';
    var c = clean(l), compact = l.replace(/\s/g, '');
    if (c.replace(/[^A-Za-z\u0590-\u05FF\u0400-\u04FF\u0600-\u06FF]/g, '').length < 3) return '';
    if (/\d{2,}/.test(l)) return '';
    if (c.length / Math.max(compact.length, 1) < 0.6) return '';
    var words = c.split(' ').filter(function (w) { return w.length > 1; });
    if (!words.length || words.length > 4) return '';
    if (words.length > 2 && words.join('').length / words.length < 2.2) return '';
    return c;
  }
  var head = lines.slice(0, 10), idAt = -1, i, c;
  for (i = 0; i < head.length; i++) { if (idOf.test(head[i])) { idAt = i; break; } }
  if (idAt > 0) {
    for (i = 0; i < idAt; i++) { c = ok(head[i]); if (c) return c.slice(0, 30); }
  }
  for (i = 0; i < head.length; i++) { c = ok(head[i]); if (c) return c.slice(0, 30); }
  var promo = String(text || '').match(/(?:בפעם הבאה|בביקור הבא)\s*ב([A-Za-z\u0590-\u05FF'׳]{2,}(?: [A-Za-z\u0590-\u05FF'׳]{2,})?)/);
  if (promo) return promo[1].trim().slice(0, 30);
  return '';
}

function scanReceipt(inp) {

  readImage(file).then(function (img) {
    pendingImg = drawScaled(img, 1100).toDataURL('image/jpeg', 0.7);
    scanHash = aHash(img);
    showPending();
    var canvas = sharpen(drawScaled(img, 1600));
    st.innerText = ocrReady ? t('scan_reading') : t('scan_reading_first');
    return runOcr(canvas, function (pr) { st.innerText = t('scan_reading') + ' ' + Math.round(pr * 100) + '%'; });
  }).then(function (text) {
    var amt = pickAmount(text);
    switchTab('expense');
    if (amt) document.getElementById('amount').value = amt;
    var cat = guessCategory(text);
    if (cat) fillCategories(cat);
    var guess = guessNote(text);
    lastGuess = guess || '';
    var known = matchMerchant(text, guess);
    var note = known || guess;
    if (note) document.getElementById('note').value = note;
    if (known && merchants[known] && merchants[known].cat && cats.expense.indexOf(merchants[known].cat) !== -1) {
      fillCategories(merchants[known].cat);
    }
    if (known) fillMerchants(known);
    st.innerText = (amt ? t('scan_found', { amt: fmt(amt) }) : t('scan_no_amount')) + (note ? '' : ' ' + t('scan_no_name'));
    pendingFp = { d: pickDate(text), t: pickTime(text), h: scanHash };
    dupOk = false;
    var dup = findDuplicate(pendingFp, amt || 0, document.getElementById('note').value);
    if (dup) showDup(dup);
  }).catch(function (e) {
    st.innerText = e && e.code === 'no_lib'
      ? t('scan_nolib')
      : t('scan_fail');
  });
}

function restoreFromText(text) {
  var d;
  try { d = JSON.parse(text); } catch (err) { backupMsg(t('bk_invalid')); return; }
  if (!d || !Array.isArray(d.entries)) { backupMsg(t('bk_invalid')); return; }
  var have = {}, added = 0;
  entries.forEach(function (e) { have[e.id] = 1; });
  d.entries.forEach(function (e) {
    if (e && e.id && e.amount > 0 && !have[e.id]) { entries.push(e); have[e.id] = 1; added++; }
  });
  entries.sort(function (a, b) { return b.id - a.id; });
  if (d.cats) {
    ['expense', 'income'].forEach(function (k) {
      (d.cats[k] || []).forEach(function (c) {
        if (cats[k].indexOf(c) === -1) cats[k].splice(Math.max(cats[k].length - 1, 0), 0, c);
      });
    });
    try { localStorage.setItem('cats', JSON.stringify(cats)); } catch (err) {}
  }
  if (d.merchants) {
    Object.keys(d.merchants).forEach(function (k) { if (!merchants[k]) merchants[k] = d.merchants[k]; });
  }
  if (d.aliases) {
    Object.keys(d.aliases).forEach(function (k) { if (!aliases[k]) aliases[k] = d.aliases[k]; });
  }
  if (d.mortgage && !mortgage && !rent && Array.isArray(d.mortgage.tracks)) { mortgage = d.mortgage; saveMortgage(); houseMode = 'mortgage'; applyRecurring(); renderHousing(); }
  if (d.rent && d.rent.amount > 0 && !rent && !mortgage) { rent = d.rent; saveRent(); houseMode = 'rent'; applyRecurring(); renderHousing(); }
  if (Array.isArray(d.recurring)) {
    d.recurring.forEach(function (r) {
      if (r && r.id && !recurring.some(function (x) { return x.id === r.id; })) recurring.push(r);
    });
    saveRecurring();
    applyRecurring();
    renderRecurring();
  }
  saveMerchants();
  fillMerchants();
  if (d.images) {
    Object.keys(d.images).forEach(function (id) {
      try { localStorage.setItem('img_' + id, d.images[id]); } catch (err) {}
    });
  }
  save();
  fillCategories();
  backupMsg(t('bk_restored', { n: added }));
}

function saveRecurring() { try { localStorage.setItem('recurring', JSON.stringify(recurring)); } catch (e) {} }
function val(id) { return document.getElementById(id).value; }
function monthIdx(key) { var q = key.split('-'); return +q[0] * 12 + (+q[1] - 1); }
function keyFromIdx(i) { return Math.floor(i / 12) + '-' + ('0' + ((i % 12) + 1)).slice(-2); }
function monthName(key) {
  var q = key.split('-');
  return new Date(+q[0], +q[1] - 1, 1).toLocaleDateString(LOCALES[lang], { month: 'long', year: 'numeric' });
}

function recDay(r, y, m) {
  var last = new Date(y, m + 1, 0).getDate();
  return Math.min(Math.max(parseInt(r.day, 10) || 1, 1), last);
}

function recStatus(r) {
  var nowI = monthIdx(monthKey(Date.now())), startI = monthIdx(r.start);
  var dueNow = new Date().getDate() >= recDay(r, Math.floor(nowI / 12), nowI % 12);
  var made = r.paid + Math.max(0, nowI - startI) + (nowI >= startI && dueNow ? 1 : 0);
  if (r.n > 0 && made > r.n) made = r.n;
  var remaining = r.n > 0 ? r.n - made : Infinity;
  return {
    made: made, remaining: remaining,
    finished: r.n > 0 && remaining <= 0,
    notStarted: nowI < startI,
    lastKey: r.n > 0 ? keyFromIdx(startI + (r.n - r.paid) - 1) : ''
  };
}

// writes each due payment as a normal expense, on the 1st of its month
function applyRecurring() {
  var nowI = monthIdx(monthKey(Date.now())), changed = false;
  var have = {}, recHave = {};
  entries.forEach(function (e) { have[e.id] = 1; if (e.rec) recHave[e.rec + ':' + e.k] = 1; });
  recurring.concat(mortItem() || [], rentItem() || []).forEach(function (r, ri) {
    var startI = monthIdx(r.start);
    for (var k = 0; startI + k <= nowI; k++) {
      var pIdx = r.paid + k + 1;
      if (r.n > 0 && pIdx > r.n) break;
      if ((r.skip || []).indexOf(pIdx) !== -1) continue;
      if (recHave[r.id + ':' + pIdx]) continue;
      var yy = Math.floor((startI + k) / 12), mm = (startI + k) % 12;
      var d = new Date(yy, mm, recDay(r, yy, mm), 0, 0, 0, 0);
      if (d.getTime() > Date.now()) break;
      var id = d.getTime() + ri + 1;
      while (have[id]) id++;
      have[id] = 1;
      entries.push({ id: id, amount: r.amtAt ? r.amtAt(pIdx) : r.amount, category: r.cat,
        note: r.name + (r.n > 0 ? ' (' + pIdx + '/' + r.n + ')' : ''),
        type: 'expense', date: d.toLocaleDateString('he-IL'), rec: r.id, k: pIdx, auto: true });
      changed = true;
    }
  });
  if (changed) {
    entries.sort(function (x, y) { return y.id - x.id; });
    try { localStorage.setItem('entries', JSON.stringify(entries)); } catch (e) {}
  }
  return changed;
}

function monthlyStats() {
  var nowKey = monthKey(Date.now()), byM = {};
  entries.forEach(function (e) {
    var k = entryMonth(e), o = byM[k] || (byM[k] = { inc: 0, exp: 0 });
    if (e.type === 'income') o.inc += e.amount; else if (!e.rec) o.exp += e.amount;
  });
  var keys = Object.keys(byM).filter(function (k) { return k < nowKey; }).sort().reverse().slice(0, 3);
  if (!keys.length && byM[nowKey]) keys = [nowKey];
  var inc = 0, exp = 0;
  keys.forEach(function (k) { inc += byM[k].inc; exp += byM[k].exp; });
  return { inc: keys.length ? inc / keys.length : 0, exp: keys.length ? exp / keys.length : 0, months: keys.length };
}

function activeFixed() {
  return recurring.reduce(function (sum, r) { return sum + (recStatus(r).finished ? 0 : r.amount); }, 0) + (mortgage ? mortActiveAmount() : 0) + (rent ? rentActiveAmount() : 0);
}

function saveIncomeField() { try { localStorage.setItem('monthlyIncome', val('recIncome')); } catch (e) {} }

function fillRecCats() {
  var sel = document.getElementById('recCat');

}

}

function addCategory(type, name) {
  if (cats[type].indexOf(name) === -1) {
    cats[type].splice(Math.max(cats[type].length - 1, 0), 0, name);

function toggleRecForm() {
  var f = document.getElementById('recForm');

function updateRecPreview() {
  var box = document.getElementById('recPreview');
  var a = parseFloat(val('recAmount')), n = parseInt(val('recN'), 10) || 0;
  var paid = parseInt(val('recPaid'), 10) || 0, cash = parseFloat(val('recCash')) || 0;
  var inc = parseFloat(val('recIncome')) || 0;
  if (!(a > 0)) { box.innerHTML = '<span class="muted">' + esc(t('pv_hint')) + '</span>'; return; }
  if (n > 0 && paid >= n) paid = n - 1;
  var dayN = Math.min(Math.max(parseInt(val('recDay'), 10) || 1, 1), 31);
  var out = ['<b>' + esc(t('pv_monthly', { amt: fmt(a) })) + '</b>', esc(t('pv_day', { d: dayN }))];
  if (n > 0) {
    var rem = n - paid;
    out.push(esc(t('pv_count', { n: n }) + (paid ? ' · ' + t('pv_paid_left', { p: paid, r: rem }) : '')));
    out.push('<b>' + esc(t('pv_total', { amt: fmt(a * n) })) + '</b>');
    if (paid) out.push(esc(t('pv_left', { amt: fmt(a * rem) })));
    var startKey = val('recStart') || monthKey(Date.now());
    out.push(esc(t('pv_last', { month: monthName(keyFromIdx(monthIdx(startKey) + rem - 1)) })));
    if (cash > 0) {
      var diff = a * n - cash, pct = Math.round(diff / cash * 100);
      out.push(esc(diff > 0.005
        ? t('pv_cash_more', { cash: fmt(cash), diff: fmt(diff), pct: pct })
        : t('pv_cash_same', { cash: fmt(cash) })));
    }
  } else {
    out.push(esc(t('pv_year', { amt: fmt(a * 12) })));
  }

  var chk = '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><b>' + esc(t('pv_check_title')) + '</b><br>';
  if (inc <= 0) {
    chk += '<span class="muted">' + esc(t('pv_no_income')) + '</span>';
  } else {
    var st = monthlyStats(), fix = activeFixed();
    var free = inc - st.exp - fix - a;
    var share = Math.round((fix + a) / inc * 100);
    var line, cls = '';
    if (free < 0) { line = t('pv_neg', { amt: fmt(-free) }); cls = 'neg'; }
    else if (share > 50) { line = t('pv_bad', { pct: share }); cls = 'neg'; }
    else if (share > 30) { line = t('pv_warn', { pct: share }); }
    else { line = t('pv_ok', { pct: share }); cls = 'pos'; }
    chk += '<b class="' + cls + '"' + (cls ? '' : ' style="color:#d97706"') + '>' + esc(line) + '</b><br>' +
      '<span class="muted" style="font-size:14px">' + esc(t('pv_breakdown', {
        inc: fmt(inc), exp: fmt(st.exp), fix: fmt(fix), new: fmt(a), left: fmt(free) })) + '</span>';
    if (!st.months) chk += '<br><span class="muted" style="font-size:14px">' + esc(t('pv_no_history')) + '</span>';
  }
  chk += '<br><span class="muted" style="font-size:13px">' + esc(t('pv_disclaimer')) + '</span></div>';
  box.innerHTML = out.join('<br>') + chk;
}

function saveRecurringForm() {
  var name = val('recName').trim();
  var a = parseFloat(val('recAmount')), n = parseInt(val('recN'), 10) || 0, paid = parseInt(val('recPaid'), 10) || 0;
  if (!name) { alert(t('rec_err_name')); return; }
  if (!(a > 0)) { alert(t('rec_err_amount')); return; }
  if (n > 0 && paid >= n) { alert(t('rec_err_paid')); return; }
  var recCategory = val('recCat') || 'אחר';
  if (recCategory === NEW_OPT) {
    recCategory = val('recNewCat').trim();
    if (!recCategory) { alert(t('err_catname')); return; }
    addCategory('expense', recCategory);
  }
  if (n <= 0) paid = 0;
  var r = { id: Date.now(), name: name.slice(0, 40), cat: recCategory, amount: a, n: n, paid: paid,
            start: val('recStart') || monthKey(Date.now()), day: Math.min(Math.max(parseInt(val('recDay'), 10) || 1, 1), 31), cash: parseFloat(val('recCash')) || 0, skip: [] };
  recurring.push(r);
  saveRecurring();
  applyRecurring();
  ['recName', 'recAmount', 'recN', 'recPaid', 'recCash', 'recDay', 'recNewCat'].forEach(function (id) { document.getElementById(id).value = ''; });
  fillCategories();
  fillRecCats();
  document.getElementById('recCat').value = recCategory;
  onRecCatChange();
  buildPicker('recCat');
  toggleRecForm();
  render();
  renderRecurring();
  toast(esc(t('rec_saved', { name: r.name, amt: fmt(a) })));
}

function deleteRecurring(id) {
  var r = recurring.filter(function (x) { return x.id === id; })[0];
  if (!r || !confirm(t('rec_stop_confirm', { name: r.name }))) return;
  recurring = recurring.filter(function (x) { return x.id !== id; });

  renderRecurring();
}

function renderRecurring() {
  var box = document.getElementById('recList');
  if (!recurring.length) { box.innerHTML = ''; return; }
  var html = recurring.map(function (r) {

    else if (r.n > 0) info = dayTxt + ' · ' + t('rec_progress', { p: s2.made, n: r.n }) + ' · ' +
      t('rec_left_total', { amt: fmt(r.amount * s2.remaining) }) + ' · ' + t('rec_ends', { month: monthName(s2.lastKey) });
    else info = dayTxt + ' · ' + t('rec_ongoing');
    return '<div class="row"><span><b>' + esc(r.name) + '</b> · ' + esc(catLabel(r.cat)) +

      '<span><b class="neg">' + esc(fmt(r.amount)) + '</b>' +

  }).join('');
  html += '<div class="sum"><span class="muted">' + esc(t('rec_total_month')) + '</span><b class="neg">' + esc(fmt(activeFixed())) + '</b></div>';
  box.innerHTML = html + '<div style="height:8px"></div>';

// ---- mortgage ----
var MORT_CAT = 'משכנתא';
var mortgage = null;
try { mortgage = JSON.parse(localStorage.getItem('mortgage') || 'null'); } catch (e) { mortgage = null; }
if (mortgage && !Array.isArray(mortgage.tracks)) mortgage = null;
function saveMortgage() { try { if (mortgage) localStorage.setItem('mortgage', JSON.stringify(mortgage)); else localStorage.removeItem('mortgage'); } catch (e) {} }
var mortOpen = false, mortEditing = false, mortDraft = [], mortExtra = '';
var MORT_TYPES = ['p', 'fu', 'fl', 'v', 'o'];

function trackPmt(tr) {
  var n = tr.years * 12, r = tr.rate / 1200;
  return r > 0 ? tr.amount * r / (1 - Math.pow(1 + r, -n)) : tr.amount / n;
}
function trackBal(tr, k) {
  var n = tr.years * 12;
  if (k >= n) return 0;
  if (k <= 0) return tr.amount;
  var r = tr.rate / 1200, p = trackPmt(tr);
  return r > 0 ? tr.amount * Math.pow(1 + r, k) - p * (Math.pow(1 + r, k) - 1) / r : tr.amount - p * k;
}
function mortAmountAt(pIdx) {
  var s = 0;
  mortgage.tracks.forEach(function (tr) { if (pIdx <= tr.years * 12) s += trackPmt(tr); });
  return Math.round(s * 100) / 100;
}
function mortN() { return Math.max.apply(null, mortgage.tracks.map(function (tr) { return tr.years * 12; })); }
function mortItem() {
  if (!mortgage || !mortgage.tracks.length) return null;
  return { id: 'mortgage', name: t('mort_name'), cat: MORT_CAT, n: mortN(), paid: mortgage.paid, start: mortgage.from,
    day: mortgage.day, skip: mortgage.skip || [], amtAt: mortAmountAt, amount: mortAmountAt(mortgage.paid + 1) };
}
function mortMade() { var it = mortItem(); return it ? recStatus(it).made : 0; }
function mortActiveAmount() {
  var it = mortItem();
  if (!it) return 0;
  var s = recStatus(it);
  return s.finished ? 0 : mortAmountAt(s.made + 1);
}

// months left and total interest from now, optionally with an extra monthly payment
function mortSim(extra) {
  var k = mortMade(), bs = mortgage.tracks.map(function (tr) { return trackBal(tr, k); });
  var months = 0, interest = 0;
  while (months < 1200 && bs.some(function (b) { return b > 0.5; })) {
    mortgage.tracks.forEach(function (tr, i) {
      if (bs[i] <= 0.5) { bs[i] = 0; return; }
      var ir = bs[i] * tr.rate / 1200, pay = Math.min(trackPmt(tr), bs[i] + ir);
      interest += ir; bs[i] = bs[i] + ir - pay;
    });
    var left = extra, best = -1;
    mortgage.tracks.forEach(function (tr, i) { if (bs[i] > 0.5 && (best < 0 || tr.rate > mortgage.tracks[best].rate)) best = i; });
    while (left > 0 && best >= 0) {
      var d = Math.min(left, bs[best]); bs[best] -= d; left -= d;
      best = -1;
      mortgage.tracks.forEach(function (tr, i) { if (bs[i] > 0.5 && (best < 0 || tr.rate > mortgage.tracks[best].rate)) best = i; });
    }
    months++;
  }
  return { months: months, interest: interest };
}

function mortSync() {
  Array.prototype.forEach.call(document.querySelectorAll('#mortTracks .mt'), function (row, i) {
    if (!mortDraft[i]) return;
    mortDraft[i].type = row.querySelector('.mt-type').value;
    mortDraft[i].amount = row.querySelector('.mt-amount').value;
    mortDraft[i].rate = row.querySelector('.mt-rate').value;
    mortDraft[i].years = row.querySelector('.mt-years').value;
  });
}
function mortEdit() {
  mortEditing = true;
  mortDraft = mortgage ? mortgage.tracks.map(function (tr) { return { type: tr.type, amount: tr.amount, rate: tr.rate, years: tr.years }; })
    : [{ type: 'p', amount: '', rate: '', years: '' }];
  renderMortgage();
}
function mortAddTrack() { mortSync(); mortDraft.push({ type: 'fu', amount: '', rate: '', years: '' }); renderMortgage(); }
function mortRemoveTrack(i) { mortSync(); mortDraft.splice(i, 1); renderMortgage(); }
function mortCancel() { mortEditing = false; renderMortgage(); }
function mortToggle() { mortOpen = !mortOpen; renderMortgage(); }
function mortExtraChange(v) { mortExtra = v; renderMortgage(); var el = document.getElementById('mortExtra'); if (el) { el.focus(); try { el.setSelectionRange(v.length, v.length); } catch (e) {} } }

function mortSave() {
  mortSync();
  var tracks = [];
  for (var i = 0; i < mortDraft.length; i++) {
    var d = mortDraft[i], a = parseFloat(d.amount), r = parseFloat(d.rate), y = parseFloat(d.years);
    if (!(a > 0) || !(r >= 0 && r <= 30) || !(y >= 1 && y <= 40)) { alert(t('mort_err_track', { n: i + 1 })); return; }
    tracks.push({ type: d.type, amount: a, rate: r, years: Math.round(y) });
  }
  var start = val('mortStart'), day = parseInt(val('mortDay'), 10);
  if (!start) { alert(t('mort_err_start')); return; }
  if (!(day >= 1 && day <= 31)) { alert(t('mort_err_day')); return; }
  if (rent && !confirm(t('house_replace_r'))) return;
  if (rent) { rent = null; saveRent(); }
  var nowKey = monthKey(Date.now());
  var from = start > nowKey ? start : nowKey;
  var paid = Math.max(0, monthIdx(from) - monthIdx(start));
  mortgage = { tracks: tracks, start: start, day: day, from: from, paid: paid, skip: mortgage ? (mortgage.skip || []) : [] };
  saveMortgage();
  mortEditing = false;
  applyRecurring();
  render();
  renderRecurring();
  renderHousing();
}
function mortDelete() {
  if (!confirm(t('mort_del_confirm'))) return;
  mortgage = null; saveMortgage(); mortEditing = false; mortOpen = false;
  renderRecurring(); renderHousing();
}

function renderMortgage() {
  var box = document.getElementById('mortBody');
  if (!box) return;
  var h = '', typeLbl = function (k) { return t('mt_' + k); };
  if (mortEditing) {
    h += '<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">🏠 ' + esc(t('mort_title')) + '</b></div>';
    h += '<div class="muted" style="font-size:14px;margin:4px 0 8px">' + esc(t('mort_form_desc')) + '</div><div id="mortTracks">';
    mortDraft.forEach(function (d, i) {
      h += '<div class="mt" style="background:var(--bg);border-radius:10px;padding:10px;margin-bottom:8px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center"><b>' + esc(t('mort_track_n', { n: i + 1 })) + '</b>' +
        (mortDraft.length > 1 ? '<button class="del" onclick="mortRemoveTrack(' + i + ')">' + esc(t('mort_remove')) + '</button>' : '') + '</div>' +
        '<select class="mt-type">' + MORT_TYPES.map(function (k) { return '<option value="' + k + '"' + (d.type === k ? ' selected' : '') + '>' + esc(typeLbl(k)) + '</option>'; }).join('') + '</select>' +
        '<input class="mt-amount" type="number" inputmode="decimal" value="' + esc(d.amount) + '" placeholder="' + esc(t('mort_amount_ph')) + '">' +
        '<input class="mt-rate" type="number" inputmode="decimal" step="0.01" value="' + esc(d.rate) + '" placeholder="' + esc(t('mort_rate_ph')) + '">' +
        '<input class="mt-years" type="number" inputmode="numeric" value="' + esc(d.years) + '" placeholder="' + esc(t('mort_years_ph')) + '"></div>';
    });
    h += '</div><button onclick="mortAddTrack()" style="background:var(--chip);color:var(--text)">' + esc(t('mort_add_track')) + '</button>';
    h += '<div class="muted" style="font-size:14px;margin-top:8px">' + esc(t('mort_start_lbl')) + '</div>' +
      '<input type="month" id="mortStart" value="' + esc(mortgage ? mortgage.start : monthKey(Date.now())) + '">' +
      '<input type="number" id="mortDay" inputmode="numeric" min="1" max="31" value="' + esc(mortgage ? mortgage.day : '') + '" placeholder="' + esc(t('mort_day_ph')) + '">';
    h += '<button onclick="mortSave()">' + esc(t('mort_save')) + '</button>' +
      '<button onclick="mortCancel()" style="background:var(--chip);color:var(--text)">' + esc(t('viewer_close')) + '</button>';
    if (mortgage) h += '<button class="del" style="margin-top:8px" onclick="mortDelete()">' + esc(t('mort_delete')) + '</button>';
    box.innerHTML = h; return;
  }
  if (!mortgage) {
    box.innerHTML = '<button onclick="mortEdit()" style="font-size:17px">🏠 ' + esc(t('mort_title')) + '</button>' +
      '<div class="muted" style="text-align:center;font-size:14px;margin-top:8px">' + esc(t('mort_hint')) + '</div>';
    return;
  }
  var it = mortItem(), st = recStatus(it), k = st.made, n = mortN();
  var total0 = 0, bal = 0, pmtNow = 0, intNow = 0, intAll = 0;
  mortgage.tracks.forEach(function (tr) {
    total0 += tr.amount; bal += trackBal(tr, k);
    intAll += trackPmt(tr) * tr.years * 12 - tr.amount;
    var kk = Math.min(Math.max(k, 1), tr.years * 12);
    if (k < tr.years * 12) { pmtNow += trackPmt(tr); intNow += trackBal(tr, kk - 1) * tr.rate / 1200; }
  });
  var pct = total0 > 0 ? Math.round((1 - bal / total0) * 100) : 0;
  pct = Math.max(0, Math.min(100, pct));
  var payNow = st.finished ? 0 : mortAmountAt(k + 1);
  h += '<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">🏠 ' + esc(t('mort_title')) + '</b>' +
    '<button class="del" onclick="mortEdit()">' + esc(t('mort_edit')) + '</button></div>';
  h += '<div style="font-size:26px;font-weight:bold;margin:6px 0">' + esc(fmt(Math.round(payNow))) + ' <span class="muted" style="font-weight:normal;font-size:13px">' + esc(t('mort_per_month', { d: mortgage.day })) + '</span></div>';
  h += '<div style="height:12px;background:var(--chip);border-radius:8px;overflow:hidden;margin:8px 0 4px"><i style="display:block;height:100%;width:' + pct + '%;background:var(--green)"></i></div>';
  h += '<div class="muted" style="font-size:13px">' + esc(t('mort_left', { amt: fmt(Math.round(bal)), p: pct })) + '</div>';
  if (mortOpen) {
    var lastKey = keyFromIdx(monthIdx(mortgage.from) + (n - mortgage.paid) - 1);
    h += '<div style="margin-top:10px">';
    var rows = [[t('mort_interest'), fmt(Math.round(intNow))], [t('mort_principal'), fmt(Math.round(Math.max(0, pmtNow - intNow)))],
      [t('mort_progress'), t('mort_progress_v', { m: Math.min(k, n), n: n })], [t('mort_total_int'), fmt(Math.round(intAll))], [t('mort_end'), monthName(lastKey)]];
    rows.forEach(function (r) { h += '<div class="row"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>'; });
    h += '</div>';
    mortgage.tracks.forEach(function (tr) {
      h += '<div style="background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;font-size:14px"><b>' + esc(typeLbl(tr.type)) + '</b> · ' + esc(fmt(tr.amount)) +
        '<br><span class="muted" style="font-size:13px">' + esc(t('mort_track_info', { r: tr.rate, y: tr.years, p: fmt(Math.round(trackPmt(tr))) })) + '</span></div>';
    });
    h += '<div style="margin-top:10px"><div class="muted" style="font-size:14px">' + esc(t('mort_whatif')) + '</div>' +
      '<input type="number" id="mortExtra" inputmode="decimal" value="' + esc(mortExtra) + '" placeholder="' + esc(t('mort_extra_ph')) + '" oninput="mortExtraChange(this.value)">';
    var ex = parseFloat(mortExtra);
    if (ex > 0 && !st.finished) {
      var a0 = mortSim(0), a1 = mortSim(ex), saved = Math.round(a0.interest - a1.interest), ms = a0.months - a1.months;
      var endKey = keyFromIdx(monthIdx(monthKey(Date.now())) + a1.months);
      h += '<div style="background:#dcfce7;color:#166534;border-radius:10px;padding:10px;font-size:14px">' + esc(t('mort_whatif_res', { amt: fmt(saved), m: ms, end: monthName(endKey) })) + '</div>';
    }
    h += '</div><div class="muted" style="font-size:12px;margin-top:10px">' + esc(t('mort_note')) + '</div>';
  }
  h += '<div onclick="mortToggle()" style="cursor:pointer;text-align:center;font-size:20px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line);margin-top:10px" aria-label="' + esc(t('mort_toggle')) + '">' + (mortOpen ? '⌃' : '⌄') + '</div>';
  box.innerHTML = h;
}

// ---- rent + housing section ----
var RENT_CAT = 'שכירות';
var rent = null;
try { rent = JSON.parse(localStorage.getItem('rent') || 'null'); } catch (e) { rent = null; }
if (rent && !(rent.amount > 0)) rent = null;

function payNumbers(line) {
  var out = [], re = /\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?/g, m;
  while ((m = re.exec(line)) !== null) {
    var before = line.charAt(m.index - 1), after = line.charAt(m.index + m[0].length);
    if (/[\/:%]/.test(after) || /[\/:]/.test(before)) continue;
    var v = parseFloat(m[0].replace(/,/g, ''));

}

    if (exclude && exclude.test(ln)) return;
    var sc = strong.test(ln) ? 3 : (weak && weak.test(ln) ? 2 : 0);
    if (!sc) return;
    var nums = payNumbers(ln);
    if (!nums.length) return;
    var v = Math.max.apply(null, nums), key = sc + ':' + v;
    votes[key] = (votes[key] || 0) + 1;
  });
  Object.keys(votes).forEach(function (k) {
    var p = k.split(':'), score = +p[0] * 10 + votes[k];
    if (score > bestScore || (score === bestScore && +p[1] > best)) { bestScore = score; best = +p[1]; }
  });
  return best;
}
function parsePayslip(text) {
  var lines = String(text || '').split('\n');
  var net = payPick(lines, /נטו\s*ל?\s*תשלום|שכר\s*נטו|נטו\s*לתשלום|net\s*(pay|salary)|take.?home/i, /נטו|net/i, /למס|לביטוח|לפנסיה|ניכוי|מקסימום/);
  var gross = payPick(lines, /שכר\s*ברוטו|סה["״'׳]?כ\s*ברוטו|סה["״'׳]?כ\s*תשלומים|gross/i, /ברוטו/);
  if (net && gross && net > gross) gross = null;
  var month = '', m = String(text).match(/(0?[1-9]|1[0-2])\s*[\/.\-]\s*(20\d{2})/);
  if (m) month = m[2] + '-' + ('0' + m[1]).slice(-2);
  else {
    var low = String(text).toLowerCase();
    for (var i = 0; i < 12 && !month; i++) {
      var yy = low.match(new RegExp('(?:' + HE_MONTHS[i] + '|' + EN_MONTHS[i] + ')[a-z]*\\s*[\\-,]?\\s*(20\\d{2})'));
      if (yy) month = yy[1] + '-' + ('0' + (i + 1)).slice(-2);
    }
  }
  return { net: net, gross: gross, month: month };
}

function payStatus(msg) { document.getElementById('payStatus').innerText = msg; }
function scanPayslip(inp) {
  var file = inp.files[0];
  if (!file) return;
  payStatus(t('scan_prepare'));
  readImage(file).then(function (img) {
    payImg = drawScaled(img, 1100).toDataURL('image/jpeg', 0.7);
    var pv = document.getElementById('payPreview');
    pv.src = payImg; pv.style.display = 'block';
    payStatus(ocrReady ? t('scan_reading') : t('scan_reading_first'));
    return runOcr(sharpen(drawScaled(img, 2000)), function (pr) { payStatus(t('scan_reading') + ' ' + Math.round(pr * 100) + '%'); });
  }).then(function (text) {
    payRaw = text;
    document.getElementById('payRaw').value = text;
    var r = parsePayslip(text);
    document.getElementById('payNet').value = r.net || '';
    document.getElementById('payGross').value = r.gross || '';
    document.getElementById('payM').value = r.month || '';
    payStatus(r.net ? t('pay_found', { net: fmt(r.net), gross: r.gross ? t('pay_found_gross', { g: fmt(r.gross) }) : '' }) : t('pay_none'));
  }).catch(function (e) {
    payStatus(e && e.code === 'no_lib' ? t('scan_nolib') : t('scan_fail'));
  });
  inp.value = '';
}

function payAdd() {
  var net = parseFloat(val('payNet')), gross = parseFloat(val('payGross')) || 0;
  if (!(net > 0)) { alert(t('pay_err')); return; }
  var pm = val('payM') || '';
  var dupe = entries.some(function (e) { return e.ps && Math.abs(e.amount - net) < 0.005 && (e.ps.m || '') === pm && pm; });
  if (dupe && !confirm(t('pay_dup', { m: monthName(pm) }))) return;
  var target = val('payAddMonth') || monthKey(Date.now()), q = target.split('-');
  var id = target === monthKey(Date.now()) ? Date.now() : new Date(+q[0], +q[1] - 1, 1, 12, 0, 0).getTime();
  var have = {};
  entries.forEach(function (e) { have[e.id] = 1; });
  while (have[id]) id++;
  var emp = val('payEmployer').trim();
  var e = { id: id, amount: net, category: 'משכורת', note: t('pay_note') + (emp ? ' · ' + emp : ''), type: 'income',
    date: new Date(id).toLocaleDateString('he-IL'), ps: { m: pm, g: gross } };
  if (payImg && document.getElementById('paySaveImg').checked) {
    try { localStorage.setItem('img_' + id, payImg); e.img = true; } catch (err) { alert(t('err_nospace')); }
  }
  entries.unshift(e);
  entries.sort(function (a, b) { return b.id - a.id; });
  save();
  ['payNet', 'payGross', 'payEmployer', 'payM', 'payRaw'].forEach(function (k) { document.getElementById(k).value = ''; });
  var pv = document.getElementById('payPreview'); pv.style.display = 'none'; pv.removeAttribute('src');
  payImg = null; payRaw = '';
  payStatus(t('pay_added', { amt: fmt(net) }));
  renderPayHist();
  renderHousing();
}

function payRemove(id) {
  if (!confirm(t('pay_del_confirm'))) return;
  removeEntry(id);
  renderPayHist();
}
function renderPayHist() {
  var box = document.getElementById('payHist');
  if (!box) return;
  var list = entries.filter(function (e) { return e.ps; });
  if (!list.length) { box.innerHTML = '<div class="muted">' + esc(t('pay_hist_empty')) + '</div>'; return; }
  box.innerHTML = list.map(function (e) {
    var title = e.ps.m ? monthName(e.ps.m) : dateStr(e);
    return '<div class="row"><span><b>' + esc(title) + '</b>' +
      (e.ps.g ? '<br><span class="muted" style="font-size:14px">' + esc(t('pay_gross_lbl', { g: fmt(e.ps.g) })) + '</span>' : '') + '</span>' +
      '<span><b class="pos">' + esc(fmt(e.amount)) + '</b>' +
      (e.img ? '<button class="del" onclick="showReceipt(' + e.id + ')">' + esc(t('pay_view')) + '</button>' : '') +
      '<button class="del" onclick="payRemove(' + e.id + ')">' + esc(t('delete_btn')) + '</button></span></div>';
  }).join('');
}

document.addEventListener('visibilitychange', function () {
  if (!document.hidden && applyRecurring()) { render(); renderRecurring(); renderHousing(); }
});

// ---- reading a payment notification ----
function parseNotification(text) {
  text = String(text || '').replace(/\s+/g, ' ').trim();
  var num = '(\\d{1,3}(?:,\\d{3})+(?:\\.\\d{1,2})?|\\d+(?:\\.\\d{1,2})?)';
  var cur = '(?:₪|ש"ח|ש״ח|שח|NIS|ILS)';
  var m = text.match(new RegExp(cur + '\\s*' + num)) || text.match(new RegExp(num + '\\s*' + cur, 'i'));
  var foreign = /(\$|€|£|USD|EUR|GBP|דולר|אירו)/i.test(text);
  var amount = m ? parseFloat(m[1].replace(/,/g, '')) : null;
  if (!amount && !foreign) {
    var m2 = text.match(new RegExp(num));
    if (m2) amount = parseFloat(m2[1].replace(/,/g, ''));
  }
  var merchant = '';
  var at = text.match(/\b(?:at|@)\s+(.+?)(?:\s+(?:on|with|using)\b|[.,;]|$)/i) ||
           text.match(/\s(?:ב-|ב־|אצל)\s*(.+?)(?:[.,;](?!\d)|$)/);
  if (at) merchant = at[1];
  if (!merchant) {
    merchant = text.replace(new RegExp(cur + '\\s*' + num, 'g'), '').replace(new RegExp(num + '\\s*' + cur, 'gi'), '')
      .replace(/(payment|paid|charged|purchase|תשלום|חיוב|עסקה|בוצעה|בוצע|סה"כ|סה״כ)/gi, '').replace(/[:\-–|]+/g, ' ').trim();
  }
  merchant = merchant.replace(new RegExp(cur + '\\s*' + num + '|' + num + '\\s*' + cur, 'gi'), ' ')
    .replace(/\s*[\d.,]+\s*$/, '').replace(/\s+/g, ' ').trim().slice(0, 40);
  var isRefund = /refund|החזר|זיכוי|ביטול עסקה/i.test(text);
  return { amount: amount, merchant: merchant, foreign: foreign && !m, refund: isRefund, raw: text };
}

function quickAdd(text, fromTest, when) {
  var r = parseNotification(text);
  if (!r.raw) return;
  var key = 'q' + r.raw.length + '_' + r.raw.slice(0, 40);
  var seen = {};
  try { seen = JSON.parse(localStorage.getItem('quickSeen') || '{}'); } catch (err) {}
  var now = Date.now();
  Object.keys(seen).forEach(function (k) { if (now - seen[k] > 600000) delete seen[k]; });
  if (!fromTest && seen[key]) { toast(t('q_seen')); return; }

  if (!r.amount) {
    switchTab('expense');
    document.getElementById('note').value = r.merchant || r.raw.slice(0, 40);
    toast(r.foreign
      ? t('q_foreign')
      : t('q_noamount'));
    return;
  }
  seen[key] = now;
  try { localStorage.setItem('quickSeen', JSON.stringify(seen)); } catch (err) {}

  var type = r.refund ? 'income' : 'expense';
  var known = matchMerchant(r.raw, r.merchant);
  if (known) { r.merchant = known; }
  var cat = (known && merchants[known] && merchants[known].cat) || guessCategory(r.raw + ' ' + r.merchant) || 'אחר';
  if (cats[type].indexOf(cat) === -1) cat = 'אחר';
  var eid = when || Date.now();
  while (entries.some(function (x) { return x.id === eid; })) eid++;
  var entry = { id: eid, amount: r.amount, category: cat, note: r.merchant, type: type,
                date: new Date(eid).toLocaleDateString('he-IL'), auto: true };
  if (known) { merchants[known].n = (merchants[known].n || 0) + 1; saveMerchants(); }
  entries.unshift(entry);
  entries.sort(function (a, b) { return b.id - a.id; });
  viewMonth = monthKey(entry.id);
  save();
  toast(esc(t(type === 'income' ? 'q_added_inc' : 'q_added_exp', {
      amt: fmt(r.amount), m: r.merchant ? ' (' + r.merchant + ')' : '', cat: catLabel(cat) })) + ' ' +
    '<button class="del" style="margin:6px 0 0" onclick="undoQuick(' + entry.id + ')">' + esc(t('q_undo')) + '</button>');
}

function undoQuick(id) {
  removeEntry(id);
  toast(t('q_undone'));
}

function testNotif() {
  quickAdd(document.getElementById('notifTest').value, true);
}

function handleLaunchParams() {
  var q = new URLSearchParams(location.search);
  var n = q.get('n');
  if (!n) return;
  try { history.replaceState(null, '', location.pathname); } catch (err) {}
  quickAdd(n, false);
}

try {
  document.getElementById('autoLink').value = location.origin + location.pathname + '?n=';
} catch (err) {}
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
applyRecurring();
applyLang();
updateNag();
handleLaunchParams();
androidInit();
</script>
