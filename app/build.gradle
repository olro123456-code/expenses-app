plugins {
    id 'com.android.application'
}

android {
    namespace 'com.olro.expenses'
    compileSdk 34

    defaultConfig {
        applicationId 'com.olro.expenses'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
